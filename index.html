<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دفتر المحل</title>
<meta name="description" content="تسيير المبيعات والمخزون والفواتير والديون للمحلات الصغيرة. يعمل بدون إنترنت.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0A1A4A" id="tc">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="دفتر المحل">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preload" href="fonts/cairo-arabic-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css">
</head>
<body class="locked">

<svg class="sprite" aria-hidden="true"><defs>
<linearGradient id="g-bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFB81C"/><stop offset=".35" stop-color="#4C83FF"/><stop offset="1" stop-color="#2352D8"/></linearGradient>
<symbol id="i-cart" viewBox="0 0 24 24"><circle cx="9" cy="20" r="1.2"/><circle cx="18" cy="20" r="1.2"/><path d="M2 3h3l2.7 12.4a1 1 0 0 0 1 .8h8.9a1 1 0 0 0 1-.8L20 7H6"/></symbol>
<symbol id="i-box" viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></symbol>
<symbol id="i-doc" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></symbol>
<symbol id="i-wallet" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h13v4"/><path d="M3 7v11a2 2 0 0 0 2 2h14a1 1 0 0 0 1-1v-9a1 1 0 0 0-1-1H5a2 2 0 0 1-2-2z"/><circle cx="16" cy="14.5" r="1"/></symbol>
<symbol id="i-chart" viewBox="0 0 24 24"><path d="M5 20V11M11 20V4M17 20v-6M3 20h18"/></symbol>
<symbol id="i-gear" viewBox="0 0 24 24"><path d="M4 6h8m4 0h4M4 12h2m4 0h10M4 18h10m4 0h2"/><circle cx="14" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="16" cy="18" r="2"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-scan" viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M4 12h16"/></symbol>
<symbol id="i-print" viewBox="0 0 24 24"><path d="M7 9V3h10v6M7 17H5a1 1 0 0 1-1-1v-5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v5a1 1 0 0 1-1 1h-2"/><path d="M7 14h10v7H7z"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></symbol>
<symbol id="i-share" viewBox="0 0 24 24"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.8l7.6-4.6M8.2 13.2l7.6 4.6"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
<symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></symbol>
<symbol id="i-bars" viewBox="0 0 24 24"><path d="M4 5v14M7 5v14M10.5 5v14M13 5v14M16.5 5v14M20 5v14" /></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
<symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></symbol>
<symbol id="i-up" viewBox="0 0 24 24"><path d="M12 16V5M7 9l5-5 5 5M5 20h14"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l5 5 9-11"/></symbol>
<symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
<symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-6 8-6s8 2 8 6"/></symbol>
<symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
<symbol id="i-logout" viewBox="0 0 24 24"><path d="M10 4H6a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h4M15 8l4 4-4 4M19 12H9"/></symbol>
<symbol id="i-store" viewBox="0 0 24 24"><path d="M4 9l1.5-5h13L20 9M4 9v11h16V9M4 9c0 1.7 1.3 3 2.7 3S9.3 10.7 9.3 9c0 1.7 1.3 3 2.7 3s2.7-1.3 2.7-3c0 1.7 1.3 3 2.7 3S20 10.7 20 9"/></symbol>
<symbol id="i-cash" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></symbol>
</defs></svg>

<div id="login" class="login" role="dialog" aria-modal="true" aria-label="تسجيل الدخول"></div>

<div class="shell">

<nav class="nav" aria-label="التنقل الرئيسي">
  <div class="brand"><img src="icon-192.png" alt=""><div><b id="shopn2">دفتر المحل</b><small>تسيير المحل</small></div></div>
  <button class="nb" data-act="go" data-a="sell"><svg class="ic"><use href="#i-cart"/></svg><span>البيع</span></button>
  <button class="nb" data-act="go" data-a="prod"><svg class="ic"><use href="#i-box"/></svg><span>المنتجات</span></button>
  <button class="nb" data-act="go" data-a="inv"><svg class="ic"><use href="#i-doc"/></svg><span>الفواتير</span></button>
  <button class="nb" data-act="go" data-a="debt"><svg class="ic"><use href="#i-wallet"/></svg><span>الديون</span></button>
  <button class="nb" data-act="go" data-a="rep"><svg class="ic"><use href="#i-chart"/></svg><span>التقارير</span></button>
  <span class="sp dsk"></span>
  <div class="sidefoot"><small>مبيعات اليوم</small><b id="today2">0 دج</b></div>
  <button class="nb dsk gear" data-act="go" data-a="set"><svg class="ic"><use href="#i-gear"/></svg><span>الإعدادات</span></button>
</nav>

<div style="flex:1;min-width:0">
<header class="top">
  <img class="mark" src="icon-192.png" alt="">
  <span class="shopn" id="shopn">دفتر المحل</span>
  <span class="pill"><small>اليوم</small><b id="today">0 دج</b></span>
  <button class="iconbtn gear-m" data-act="go" data-a="set" aria-label="الإعدادات"><svg class="ic"><use href="#i-gear"/></svg></button>
</header>

<main>

<!-- ============ البيع ============ -->
<section id="v-sell" class="view on">
  <div id="bk-sell"></div>

  <div class="sellgrid">
    <div>
    <div class="hero" aria-label="ملخص اليوم">
      <div class="hero-t"><span id="h-hello">مرحباً</span><span id="h-date"></span></div>
      <div class="hero-n"><span>مبيعات اليوم</span><b id="h-today">0 دج</b></div>
      <div class="hero-s"><span><b id="h-n">0</b>فاتورة</span><span><b id="h-g">0 دج</b>ربح</span></div>
    </div>
      <div class="inrow">
        <label class="search"><svg class="ic"><use href="#i-search"/></svg>
          <input id="q" type="search" placeholder="ابحث بالاسم أو الباركود" data-in="rl" autocomplete="off" aria-label="بحث"></label>
        <button class="btn out" data-act="scan" data-a="sell" aria-label="مسح الباركود"><svg class="ic"><use href="#i-scan"/></svg><span class="dsk-t">مسح</span></button>
      </div>
      <div id="plist" class="pgrid"></div>
    </div>

    <button class="cartbar" id="cartbar" data-act="cart" hidden><span id="cb-n">الفاتورة</span><span id="cb-t"></span></button>
    <div class="backdrop" id="bdrop" data-act="cart" hidden></div>
    <aside class="receipt" id="receipt" aria-label="الفاتورة الحالية">
      <div class="grab"></div>
      <div class="rh"><b>الفاتورة <span class="num" id="r-no"></span></b><button class="btn out sm" data-act="clear">تفريغ</button></div>
      <div id="cart"></div>
      <div class="sums">
        <div class="ln"><span>المجموع</span><span id="r-sub">0 دج</span></div>
        <div class="disc"><label for="disc">تخفيض</label><input id="disc" type="number" inputmode="decimal" min="0" placeholder="0" data-in="rc"></div>
        <div class="ln t"><span>الصافي</span><span id="r-tot">0 دج</span></div>
      </div>
      <div class="pay">
        <div class="seg" role="group" aria-label="طريقة الدفع">
          <button data-act="pay" data-a="cash" aria-pressed="true">نقداً</button>
          <button data-act="pay" data-a="debt" aria-pressed="false">بالدين</button>
        </div>
      </div>
      <div id="whow" hidden><input id="who" list="custs" placeholder="اسم الزبون" autocomplete="off" aria-label="اسم الزبون"><datalist id="custs"></datalist></div>
      <button class="btn gold block" style="margin-top:10px;font-size:17px" data-act="checkout"><svg class="ic"><use href="#i-check"/></svg>تأكيد البيع</button>
    </aside>
  </div>
</section>

<!-- ============ المنتجات ============ -->
<section id="v-prod" class="view">
  <div class="tiles" id="p-tiles"></div>
  <div class="inrow">
    <label class="search"><svg class="ic"><use href="#i-search"/></svg><input id="pq" type="search" placeholder="ابحث في المنتجات" data-in="rp" autocomplete="off" aria-label="بحث في المنتجات"></label>
    <button class="btn" data-act="newp"><svg class="ic"><use href="#i-plus"/></svg>منتج جديد</button>
    <button class="btn gold" data-act="quick">🥚 إضافة سريعة</button>
  </div>
  <div class="chips" role="group" aria-label="تصفية">
    <button class="chip" data-act="pf" data-a="all" aria-pressed="true">الكل</button>
    <button class="chip" data-act="pf" data-a="low" aria-pressed="false">الناقصة</button>
    <button class="chip" data-act="pf" data-a="out" aria-pressed="false">النافدة</button>
  </div>
  <div id="stock" class="list"></div>
</section>

<!-- ============ الفواتير ============ -->
<section id="v-inv" class="view">
  <label class="search" style="display:block;margin-bottom:6px"><svg class="ic"><use href="#i-search"/></svg><input id="iq" type="search" placeholder="ابحث برقم الفاتورة أو اسم الزبون" data-in="ri" autocomplete="off" aria-label="بحث في الفواتير"></label>
  <div id="invs"></div>
</section>

<!-- ============ الديون ============ -->
<section id="v-debt" class="view">
  <div id="debts"></div>
</section>

<!-- ============ التقارير ============ -->
<section id="v-rep" class="view">
  <div id="bk-rep"></div>
  <div id="reps"></div>
</section>

<!-- ============ الإعدادات ============ -->
<section id="v-set" class="view">
  <div id="sets"></div>
</section>

</main>
</div>
</div>

<div id="toast" role="status" aria-live="polite"></div>
<div id="cam" class="cam"><video id="camv" playsinline muted></video><button class="btn gold" data-act="stopcam">إغلاق الكاميرا</button></div>
<dialog id="dlg"></dialog>
<div id="printarea"></div>

<script src="app.js"></script>
</body>
</html>
